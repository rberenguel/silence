<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="fonts/iconoir/iconoir.css">
<link rel="stylesheet" href="fonts/sixtyfour.css">
<link rel="stylesheet" href="fonts/monoid.css">
<style>
  body { background-color: #000000; color: #33ff00; font-family: 'monoidregular', monospace; margin: 0; overflow: hidden; touch-action: none; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }
  #game-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 30; }
  .hud-text { background: rgba(0, 20, 0, 0.8); padding: 8px 15px; border: 1px solid #33ff00; font-size: 20px; text-shadow: 0 0 5px #33ff00; }
  .rms-indicator { margin-left: 8px; display: inline-block; vertical-align: middle; }
  #controls-hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #00aa00; font-size: 12px; pointer-events: none; z-index: 30; }

  #splash-screen {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 20, 0, 0.95);
    border: 2px solid #33ff00;
    padding: 40px 60px;
    text-align: center;
    z-index: 100;
    box-shadow: 0 0 30px #33ff00;
  }
  #splash-screen h1 {
    font-family: 'Sixtyfour', monospace;
    font-size: 72px;
    color: #33ff00;
    margin: 0 0 30px 0;
    text-shadow: 0 0 10px #33ff00;
  }
  #splash-screen p {
    font-size: 18px;
    line-height: 1.8;
    margin: 12px 0;
    color: #88ff88;
  }
  #splash-screen .tap-hint {
    margin-top: 40px;
    font-size: 16px;
    color: #00aa00;
    animation: pulse 2s infinite;
  }
  @media (max-width: 768px) {
    #splash-screen h1 { font-size: 48px; margin: 0 0 20px 0; }
    #splash-screen p { font-size: 14px; line-height: 1.6; margin: 10px 0; }
    #splash-screen .tap-hint { margin-top: 30px; font-size: 12px; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div id="splash-screen">
  <h1>SILENCE</h1>
  <p>Cancel the noise signal using destructive interference</p>
  <p><strong>DRAG:</strong> Position wavelet horizontally</p>
  <p><strong>TAP TOP:</strong> Drop wavelet to merge</p>
  <p><strong>TAP BOTTOM:</strong> Flip wavelet polarity</p>
  <p>Keep RMS below 5.0 to survive</p>
  <div class="tap-hint">TAP TO START</div>
</div>

<div id="game-ui">
  <div class="hud-text">RMS: <span id="noise-lvl">0.00</span><i id="rms-trend" class="rms-indicator"></i></div>
  <div class="hud-text" id="status-display">COMPLEXITY: <span id="complexity-disp">1</span></div>
</div>
<canvas id="scope"></canvas>
<div id="controls-hint">DRAG: Align Phase | TAP TOP: Drop | TAP BOTTOM: Flip</div>

<script>
window.addEventListener('load', function() {
    const canvas = document.getElementById('scope');
    const ctx = canvas.getContext('2d');
    
    // --- CONFIG ---
    const POINTS = 100; // High resolution for complex waves
    let WIDTH, HEIGHT, SEGMENT_WIDTH, CENTER_Y, SCALE_Y;
    
    // --- STATE ---
    let noiseSignal = new Array(POINTS).fill(0);
    let particles = [];
    let packet = { vals: [], xIndex: 0, yOffset: -150 };
    let isDropping = false;
    let gameRunning = false; // Start with game paused for splash
    let gameStarted = false;

    // Progression
    let score = 0;
    let complexity = 1; // Starts simple (1-2 bumps), scales up
    let lastRMS = 0;
    let rmsTrendTimer = 0;

    // Preview queue - holds next 3 wavelets
    let waveletQueue = [];

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        WIDTH = window.innerWidth;
        HEIGHT = window.innerHeight;

        SEGMENT_WIDTH = WIDTH / (POINTS - 1);
        CENTER_Y = HEIGHT * 0.6; // Move signal lower to make room for preview
        SCALE_Y = HEIGHT / 30;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- PROCEDURAL GENERATION ---

    function generateNoise() {
        // The "Problem" to solve. Needs to be messy but solvable.
        let t = Date.now() * 0.001;
        for(let i=0; i<POINTS; i++) {
            // Base Low Freq
            let val = Math.sin(i * 0.2 + t) * 3;
            // Mid Freq
            val += Math.sin(i * 0.7 - t) * 2;
            // High Freq Jitter
            val += (Math.random() - 0.5) * 1.5;
            noiseSignal[i] = val;
        }
    }

    function createProceduralPacket(lvl) {
        // "The more there are the harder it is"
        // Lvl 1: Width ~10, 1-2 peaks.
        // Lvl 5: Width ~30, multiple peaks/valleys.
        
        const width = Math.min(60, 12 + (lvl * 4)); 
        const arr = [];
        
        // Random characteristics
        const freq = 0.3 + (Math.random() * 0.5); // How wiggly
        const phase = Math.random() * Math.PI * 2;
        const harmonics = 1 + Math.floor(lvl / 3); // Add extra sine waves at higher levels
        
        for(let i=0; i<width; i++) {
            // Window Function (Hanning) to ensure ends taper to 0 smoothly
            // This creates a "Packet" rather than a hard cut signal
            const window = 0.5 * (1 - Math.cos(2 * Math.PI * i / (width - 1)));
            
            let val = Math.sin((i * freq) + phase);
            
            // Add jaggedness/harmonics
            if (harmonics > 1) {
                val += Math.sin((i * freq * 2.5)) * 0.5;
            }
            
            // Scale amplitude (sometimes positive, sometimes negative average)
            // We want it to be distinct.
            val *= (3 + Math.random() * 2); 
            
            // Apply window
            arr.push(val * window);
        }
        
        // Randomly flip the whole thing so we get valleys too
        if(Math.random() > 0.5) {
             for(let k=0; k<arr.length; k++) arr[k] *= -1;
        }

        return arr;
    }

    function spawnPacket() {
        // Pull from queue or generate new if queue is empty
        if (waveletQueue.length > 0) {
            packet.vals = waveletQueue.shift(); // Take first from queue
        } else {
            packet.vals = createProceduralPacket(complexity);
        }

        // Add new wavelet to end of queue to maintain 3 ahead
        waveletQueue.push(createProceduralPacket(complexity));

        packet.xIndex = Math.floor(POINTS/2) - Math.floor(packet.vals.length/2);
        packet.yOffset = -HEIGHT * 0.3;
        isDropping = false;
    }

    // --- ENGINE ---

    function update() {
        if (!gameRunning) return;
        
        // RMS & Clipping
        let sumSq = 0;
        let maxVal = 0;
        for(let i=0; i<POINTS; i++) {
            let v = noiseSignal[i] || 0;
            sumSq += v*v;
            if(Math.abs(v) > maxVal) maxVal = Math.abs(v);
        }
        
        let rms = Math.sqrt(sumSq / POINTS);
        document.getElementById('noise-lvl').innerText = rms.toFixed(2);

        // Update trend indicator with persistence
        if (rmsTrendTimer > 0) {
            rmsTrendTimer--;
            if (rmsTrendTimer === 0) {
                document.getElementById('rms-trend').className = 'rms-indicator';
            }
        }

        // Win condition
        if (rms < 0.1) {
            gameWin();
        }

        // Game over conditions
        if (maxVal > 25 || rms > 5) {
            gameOver();
        }

        // Logic
        if (isDropping) {
            packet.yOffset += HEIGHT * 0.1; // Fast drop
            if (packet.yOffset >= 0) mergeSignal();
        }
        
        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life -= 0.05;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function mergeSignal() {
        let maxImpact = 0;

        // Calculate RMS before merge
        let sumSqBefore = 0;
        for(let i=0; i<POINTS; i++) {
            let v = noiseSignal[i] || 0;
            sumSqBefore += v*v;
        }
        let rmsBefore = Math.sqrt(sumSqBefore / POINTS);

        for (let i = 0; i < packet.vals.length; i++) {
            const idx = packet.xIndex + i;
            if (idx >= 0 && idx < POINTS) {
                const oldVal = noiseSignal[idx];
                noiseSignal[idx] += packet.vals[i];

                // Visual feedback: Calculate how much we reduced/increased the signal
                const delta = Math.abs(oldVal) - Math.abs(noiseSignal[idx]);

                // If delta is positive, we reduced noise (Good).
                // If negative, we added noise (Bad).
                if (delta > 0.5) {
                   spawnParticle(idx * SEGMENT_WIDTH, CENTER_Y - (noiseSignal[idx]*SCALE_Y), '#00ff00'); // Green spark
                } else if (delta < -2) {
                   spawnParticle(idx * SEGMENT_WIDTH, CENTER_Y - (noiseSignal[idx]*SCALE_Y), '#ff0000'); // Red spark
                }
            }
        }

        // Calculate RMS after merge and set trend
        let sumSqAfter = 0;
        for(let i=0; i<POINTS; i++) {
            let v = noiseSignal[i] || 0;
            sumSqAfter += v*v;
        }
        let rmsAfter = Math.sqrt(sumSqAfter / POINTS);

        const trendEl = document.getElementById('rms-trend');
        if (rmsAfter > rmsBefore) {
            trendEl.className = 'rms-indicator iconoir-graph-up';
            trendEl.style.color = '#ff0000';
            rmsTrendTimer = 180; // Show for ~3 seconds at 60fps
        } else if (rmsAfter < rmsBefore) {
            trendEl.className = 'rms-indicator iconoir-graph-down';
            trendEl.style.color = '#00ff00';
            rmsTrendTimer = 180; // Show for ~3 seconds at 60fps
        }
        lastRMS = rmsAfter;

        // Progression - complexity based on RMS reduction
        score++;

        // Increase complexity as player reduces RMS
        // Start at ~2.5 RMS, complexity 1
        // Every time RMS drops below certain thresholds, increase complexity
        if (rmsAfter < 2.0 && complexity === 1) {
            complexity = 2;
            document.getElementById('complexity-disp').innerText = complexity;
        } else if (rmsAfter < 1.5 && complexity === 2) {
            complexity = 3;
            document.getElementById('complexity-disp').innerText = complexity;
        } else if (rmsAfter < 1.0 && complexity === 3) {
            complexity = 4;
            document.getElementById('complexity-disp').innerText = complexity;
        } else if (rmsAfter < 0.7 && complexity === 4) {
            complexity = 5;
            document.getElementById('complexity-disp').innerText = complexity;
        } else if (rmsAfter < 0.5 && complexity === 5) {
            complexity = 6;
            document.getElementById('complexity-disp').innerText = complexity;
        }

        spawnPacket();
    }

    function gameWin() {
        gameRunning = false;
        const statusEl = document.getElementById('status-display');
        statusEl.innerText = "SILENCE ACHIEVED! TAP TO RESTART";
        statusEl.style.borderColor = "#00ff00";
        statusEl.style.color = "#00ff00";
    }

    function gameOver() {
        gameRunning = false;
        const statusEl = document.getElementById('status-display');
        statusEl.innerText = "OVERLOAD - TAP TO RESTART";
        statusEl.style.borderColor = "red";
        statusEl.style.color = "red";
    }

    function resetGame() {
        generateNoise();
        complexity = 1;
        score = 0;
        waveletQueue = [];
        // Pre-fill queue with 3 wavelets
        for (let i = 0; i < 3; i++) {
            waveletQueue.push(createProceduralPacket(complexity));
        }
        spawnPacket();
        gameRunning = true;

        const statusEl = document.getElementById('status-display');
        statusEl.innerText = "COMPLEXITY: ";
        statusEl.style.borderColor = "#33ff00";
        statusEl.style.color = "#33ff00";

        const complexitySpan = document.createElement('span');
        complexitySpan.id = 'complexity-disp';
        complexitySpan.innerText = complexity;
        statusEl.appendChild(complexitySpan);
    }

    function spawnParticle(x, y, color) {
        particles.push({x: x, y: y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1.0, c: color});
    }

    // --- RENDER ---
    // Catmull-Rom spline interpolation for smooth curves
    function catmullRom(p0, p1, p2, p3, t) {
        const v0 = (p2 - p0) * 0.5;
        const v1 = (p3 - p1) * 0.5;
        const t2 = t * t;
        const t3 = t * t2;
        return (2 * p1 - 2 * p2 + v0 + v1) * t3 +
               (-3 * p1 + 3 * p2 - 2 * v0 - v1) * t2 +
               v0 * t + p1;
    }

    function drawLine(data, offsetY, color, width, glow) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineJoin = 'round';
        ctx.shadowBlur = glow ? 5 : 0;
        ctx.shadowColor = color;
        ctx.beginPath();

        // Draw smooth curve using spline interpolation
        for (let i = 0; i < data.length - 1; i++) {
            const p0 = i > 0 ? data[i - 1] : data[i];
            const p1 = data[i];
            const p2 = data[i + 1];
            const p3 = i < data.length - 2 ? data[i + 2] : data[i + 1];

            const steps = 10; // Subdivisions between points for smoothness
            for (let s = 0; s <= steps; s++) {
                const t = s / steps;
                const x = (i + t) * SEGMENT_WIDTH;
                const interpolatedY = catmullRom(p0, p1, p2, p3, t);
                const y = CENTER_Y + offsetY - (interpolatedY * SCALE_Y);

                if (i === 0 && s === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
        }

        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    function drawPacket() {
        // Draw the actual floating packet with smooth interpolation
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 5; ctx.shadowColor = '#ffcc00';
        ctx.beginPath();

        for (let i = 0; i < packet.vals.length - 1; i++) {
            const p0 = i > 0 ? packet.vals[i - 1] : packet.vals[i];
            const p1 = packet.vals[i];
            const p2 = packet.vals[i + 1];
            const p3 = i < packet.vals.length - 2 ? packet.vals[i + 2] : packet.vals[i + 1];

            const steps = 10;
            for (let s = 0; s <= steps; s++) {
                const t = s / steps;
                const x = (packet.xIndex + i + t) * SEGMENT_WIDTH;
                const interpolatedY = catmullRom(p0, p1, p2, p3, t);
                const y = CENTER_Y + packet.yOffset - (interpolatedY * SCALE_Y);

                if (i === 0 && s === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
        }

        ctx.stroke();
        ctx.shadowBlur = 0;

        // Draw GHOST (Projection) with smooth interpolation
        ctx.strokeStyle = 'rgba(255, 204, 0, 0.4)';
        ctx.save();
        ctx.setLineDash([2, 4]);
        ctx.lineWidth = 2;
        ctx.beginPath();

        for (let i = 0; i < packet.vals.length - 1; i++) {
            const p0 = i > 0 ? packet.vals[i - 1] : packet.vals[i];
            const p1 = packet.vals[i];
            const p2 = packet.vals[i + 1];
            const p3 = i < packet.vals.length - 2 ? packet.vals[i + 2] : packet.vals[i + 1];

            const steps = 10;
            for (let s = 0; s <= steps; s++) {
                const t = s / steps;
                const x = (packet.xIndex + i + t) * SEGMENT_WIDTH;
                const interpolatedY = catmullRom(p0, p1, p2, p3, t);
                const y = CENTER_Y - (interpolatedY * SCALE_Y);

                if (i === 0 && s === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
        }

        ctx.stroke();
        ctx.restore();
    }

    function drawPreview() {
        const previewX = 30; // Left side below RMS
        const startY = 80; // Start below HUD
        const boxSize = 60; // Size of each preview box
        const spacing = 70; // Vertical spacing between boxes

        for (let q = 0; q < Math.min(3, waveletQueue.length); q++) {
            const vals = waveletQueue[q];
            const boxY = startY + (q * spacing);
            const centerY = boxY + boxSize / 2;

            // Draw box around next wavelet (index 0)
            if (q === 0) {
                ctx.strokeStyle = '#33ff00';
                ctx.lineWidth = 2;
                ctx.strokeRect(previewX, boxY, boxSize, boxSize);
            } else {
                ctx.strokeStyle = 'rgba(51, 255, 0, 0.3)';
                ctx.lineWidth = 1;
                ctx.strokeRect(previewX, boxY, boxSize, boxSize);
            }

            // Find max amplitude to scale properly within the box
            let maxAmp = 0;
            for (let i = 0; i < vals.length; i++) {
                if (Math.abs(vals[i]) > maxAmp) maxAmp = Math.abs(vals[i]);
            }
            const previewScale = maxAmp > 0 ? (boxSize * 0.4) / maxAmp : 1;

            // Draw the wavelet inside the box
            ctx.strokeStyle = q === 0 ? '#ffcc00' : 'rgba(255, 204, 0, 0.5)';
            ctx.lineWidth = q === 0 ? 2 : 1.5;
            ctx.beginPath();

            for (let i = 0; i < vals.length; i++) {
                const x = previewX + 5 + (i / vals.length) * (boxSize - 10);
                const y = centerY - (vals[i] * previewScale);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
    }

    function loop() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Zero Line
        ctx.strokeStyle = '#002200'; ctx.lineWidth=1; ctx.beginPath();
        ctx.moveTo(0, CENTER_Y); ctx.lineTo(WIDTH, CENTER_Y); ctx.stroke();

        drawLine(noiseSignal, 0, '#33ff00', 2, true);
        if(gameRunning) {
            drawPacket();
            drawPreview();
        }

        particles.forEach(function(p) {
            ctx.fillStyle = p.c;
            ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;
        update();
        requestAnimationFrame(loop);
    }

    // --- INPUT ---
    let startX = 0;
    let startY = 0;
    let isDragging = false;
    let isMouseDown = false;

    function inputStart(x, y) {
        startX = x;
        startY = y;
        isDragging = false;
        isMouseDown = true;
    }

    function inputMove(x) {
        if (!gameRunning || !isMouseDown) return;
        const diff = x - startX;
        if (Math.abs(diff) > 5) isDragging = true; // Small deadzone

        if (isDragging && !isDropping) {
            // Sensitivity - faster movement
            if (Math.abs(diff) > SEGMENT_WIDTH * 0.3) {
                const dir = diff > 0 ? 1 : -1;
                packet.xIndex += dir;

                // Bounds Check
                if(packet.xIndex < 0) packet.xIndex = 0;
                if(packet.xIndex + packet.vals.length > POINTS) packet.xIndex = POINTS - packet.vals.length;

                startX = x;
            }
        }
    }

    function inputEnd() {
        // Handle splash screen
        if (!gameStarted) {
            document.getElementById('splash-screen').style.display = 'none';
            gameStarted = true;
            gameRunning = true;
            isDragging = false;
            isMouseDown = false;
            return;
        }

        // Handle game over restart
        if (!gameRunning) {
            resetGame();
            isDragging = false;
            isMouseDown = false;
            return;
        }

        // Normal game input - only if we didn't drag
        if (!isDragging) {
            if (startY > HEIGHT / 2) {
                // Lower half: Flip the wavelet
                for (let i = 0; i < packet.vals.length; i++) {
                    packet.vals[i] *= -1;
                }
            } else {
                // Upper half: Drop the wavelet
                if (!isDropping) isDropping = true;
            }
        }
        isDragging = false;
        isMouseDown = false;
    }

    canvas.addEventListener('mousedown', e => inputStart(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', e => inputStart(e.touches[0].clientX, e.touches[0].clientY), {passive: false});

    canvas.addEventListener('mousemove', e => inputMove(e.clientX));
    canvas.addEventListener('touchmove', e => { e.preventDefault(); inputMove(e.touches[0].clientX); }, {passive: false});

    canvas.addEventListener('mouseup', inputEnd);
    canvas.addEventListener('touchend', inputEnd);

    // Boot
    generateNoise();
    // Pre-fill queue with 3 wavelets
    for (let i = 0; i < 3; i++) {
        waveletQueue.push(createProceduralPacket(complexity));
    }
    spawnPacket();
    requestAnimationFrame(loop);
});
</script>
</body>
</html>
