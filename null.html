<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body { background-color: #050505; color: #33ff00; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; touch-action: none; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }
  #game-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 30; }
  .hud-text { background: rgba(0, 20, 0, 0.8); padding: 5px 10px; border: 1px solid #33ff00; font-size: 14px; text-shadow: 0 0 5px #33ff00; }
  #controls-hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #00aa00; font-size: 12px; pointer-events: none; z-index: 30; }
  /* Status overlay for "Complexity Level" */
  #level-indicator { position: absolute; top: 50px; left: 10px; font-size: 10px; color: #008800; pointer-events: none; }
</style>
</head>
<body>

<div id="game-ui">
  <div class="hud-text">RMS: <span id="noise-lvl">0.00</span></div>
  <div class="hud-text" id="status">ACQUIRING</div>
</div>
<div id="level-indicator">HARMONICS: <span id="complexity-disp">1</span></div>
<canvas id="scope"></canvas>
<div id="controls-hint">DRAG: Align Phase | TAP: MERGE</div>

<script>
window.addEventListener('load', function() {
    const canvas = document.getElementById('scope');
    const ctx = canvas.getContext('2d');
    
    // --- CONFIG ---
    const POINTS = 100; // High resolution for complex waves
    let WIDTH, HEIGHT, SEGMENT_WIDTH, CENTER_Y, SCALE_Y;
    
    // --- STATE ---
    let noiseSignal = new Array(POINTS).fill(0);
    let particles = [];
    let packet = { vals: [], xIndex: 0, yOffset: -150 };
    let isDropping = false;
    let gameRunning = true;
    
    // Progression
    let score = 0;
    let complexity = 1; // Starts simple (1-2 bumps), scales up

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); 
        
        WIDTH = window.innerWidth;
        HEIGHT = window.innerHeight;
        
        SEGMENT_WIDTH = WIDTH / (POINTS - 1);
        CENTER_Y = HEIGHT / 2;
        SCALE_Y = HEIGHT / 30; 
    }
    window.addEventListener('resize', resize);
    resize();

    // --- PROCEDURAL GENERATION ---

    function generateNoise() {
        // The "Problem" to solve. Needs to be messy but solvable.
        let t = Date.now() * 0.001;
        for(let i=0; i<POINTS; i++) {
            // Base Low Freq
            let val = Math.sin(i * 0.2 + t) * 3;
            // Mid Freq
            val += Math.sin(i * 0.7 - t) * 2;
            // High Freq Jitter
            val += (Math.random() - 0.5) * 1.5;
            noiseSignal[i] = val;
        }
    }

    function createProceduralPacket(lvl) {
        // "The more there are the harder it is"
        // Lvl 1: Width ~10, 1-2 peaks.
        // Lvl 5: Width ~30, multiple peaks/valleys.
        
        const width = Math.min(60, 12 + (lvl * 4)); 
        const arr = [];
        
        // Random characteristics
        const freq = 0.3 + (Math.random() * 0.5); // How wiggly
        const phase = Math.random() * Math.PI * 2;
        const harmonics = 1 + Math.floor(lvl / 3); // Add extra sine waves at higher levels
        
        for(let i=0; i<width; i++) {
            // Window Function (Hanning) to ensure ends taper to 0 smoothly
            // This creates a "Packet" rather than a hard cut signal
            const window = 0.5 * (1 - Math.cos(2 * Math.PI * i / (width - 1)));
            
            let val = Math.sin((i * freq) + phase);
            
            // Add jaggedness/harmonics
            if (harmonics > 1) {
                val += Math.sin((i * freq * 2.5)) * 0.5;
            }
            
            // Scale amplitude (sometimes positive, sometimes negative average)
            // We want it to be distinct.
            val *= (3 + Math.random() * 2); 
            
            // Apply window
            arr.push(val * window);
        }
        
        // Randomly flip the whole thing so we get valleys too
        if(Math.random() > 0.5) {
             for(let k=0; k<arr.length; k++) arr[k] *= -1;
        }

        return arr;
    }

    function spawnPacket() {
        packet.vals = createProceduralPacket(complexity);
        packet.xIndex = Math.floor(POINTS/2) - Math.floor(packet.vals.length/2);
        packet.yOffset = -HEIGHT * 0.4; 
        isDropping = false;
        
        // Visual indicator of current difficulty
        document.getElementById('complexity-disp').innerText = complexity;
    }

    // --- ENGINE ---

    function update() {
        if (!gameRunning) return;
        
        // RMS & Clipping
        let sumSq = 0;
        let maxVal = 0;
        for(let i=0; i<POINTS; i++) {
            let v = noiseSignal[i] || 0;
            sumSq += v*v;
            if(Math.abs(v) > maxVal) maxVal = Math.abs(v);
        }
        
        let rms = Math.sqrt(sumSq / POINTS);
        document.getElementById('noise-lvl').innerText = rms.toFixed(2);

        // Dynamic Clipping Threshold
        if (maxVal > 25) { 
            gameOver();
        }

        // Logic
        if (isDropping) {
            packet.yOffset += HEIGHT * 0.1; // Fast drop
            if (packet.yOffset >= 0) mergeSignal();
        }
        
        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life -= 0.05;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function mergeSignal() {
        let maxImpact = 0;
        
        for (let i = 0; i < packet.vals.length; i++) {
            const idx = packet.xIndex + i;
            if (idx >= 0 && idx < POINTS) {
                const oldVal = noiseSignal[idx];
                noiseSignal[idx] += packet.vals[i];
                
                // Visual feedback: Calculate how much we reduced/increased the signal
                const delta = Math.abs(oldVal) - Math.abs(noiseSignal[idx]);
                
                // If delta is positive, we reduced noise (Good). 
                // If negative, we added noise (Bad).
                if (delta > 0.5) {
                   spawnParticle(idx * SEGMENT_WIDTH, CENTER_Y - (noiseSignal[idx]*SCALE_Y), '#00ff00'); // Green spark
                } else if (delta < -2) {
                   spawnParticle(idx * SEGMENT_WIDTH, CENTER_Y - (noiseSignal[idx]*SCALE_Y), '#ff0000'); // Red spark
                }
            }
        }
        
        // Progression
        score++;
        if (score % 3 === 0) complexity++; // Increase difficulty every 3 drops
        
        spawnPacket();
    }

    function gameOver() {
        gameRunning = false;
        const s = document.getElementById('status');
        s.innerText = "SYSTEM OVERLOAD - TAP TO RESET";
        s.style.borderColor = "red";
        s.style.color = "red";
    }

    function resetGame() {
        generateNoise();
        complexity = 1;
        score = 0;
        spawnPacket();
        gameRunning = true;
        const s = document.getElementById('status');
        s.innerText = "ACQUIRING";
        s.style.borderColor = "#33ff00";
        s.style.color = "#33ff00";
    }

    function spawnParticle(x, y, color) {
        particles.push({x: x, y: y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1.0, c: color});
    }

    // --- RENDER ---
    function drawLine(data, offsetY, color, width, glow) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineJoin = 'round';
        ctx.shadowBlur = glow ? 15 : 0;
        ctx.shadowColor = color;
        ctx.beginPath();
        for (let i = 0; i < data.length; i++) {
            const x = i * SEGMENT_WIDTH;
            const y = CENTER_Y + offsetY - (data[i] * SCALE_Y);
            if (i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    function drawPacket() {
        // Draw the actual floating packet
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15; ctx.shadowColor = '#ffcc00';
        ctx.beginPath();
        for (let i = 0; i < packet.vals.length; i++) {
            const x = (packet.xIndex + i) * SEGMENT_WIDTH;
            const y = CENTER_Y + packet.yOffset - (packet.vals[i] * SCALE_Y);
            if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();

        // Draw GHOST (Projection) - Critical for alignment now that shapes are complex
        ctx.strokeStyle = 'rgba(255, 204, 0, 0.4)';
        ctx.save();
        ctx.setLineDash([2, 4]); // Tighter dash
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < packet.vals.length; i++) {
            const x = (packet.xIndex + i) * SEGMENT_WIDTH;
            // Draw it ON TOP of the noise line (y=0 relative to signal)
            const y = CENTER_Y - (packet.vals[i] * SCALE_Y);
            if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
        ctx.restore();
    }

    function loop() {
        ctx.fillStyle = 'rgba(5, 5, 5, 0.4)'; 
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        
        // Zero Line
        ctx.strokeStyle = '#002200'; ctx.lineWidth=1; ctx.beginPath();
        ctx.moveTo(0, CENTER_Y); ctx.lineTo(WIDTH, CENTER_Y); ctx.stroke();

        ctx.globalCompositeOperation = 'lighter';
        drawLine(noiseSignal, 0, '#33ff00', 2, true);
        if(gameRunning) drawPacket();
        
        particles.forEach(function(p) {
            ctx.fillStyle = p.c;
            ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;
        
        ctx.globalCompositeOperation = 'source-over';
        update();
        requestAnimationFrame(loop);
    }

    // --- INPUT ---
    let startX = 0;
    let isDragging = false;

    function inputStart(x) { startX = x; isDragging = false; }
    
    function inputMove(x) {
        if (!gameRunning) return;
        const diff = x - startX;
        if (Math.abs(diff) > 5) isDragging = true; // Small deadzone
        
        if (isDragging && !isDropping) {
            // Sensitivity
            if (Math.abs(diff) > SEGMENT_WIDTH * 0.8) {
                const dir = diff > 0 ? 1 : -1;
                packet.xIndex += dir;
                
                // Bounds Check
                if(packet.xIndex < 0) packet.xIndex = 0;
                if(packet.xIndex + packet.vals.length > POINTS) packet.xIndex = POINTS - packet.vals.length;
                
                startX = x;
            }
        }
    }
    
    function inputEnd() {
        if (!gameRunning) { resetGame(); return; }
        
        // If we didn't drag (Tap), or user lifted finger after positioning
        // User asked: "Tap to merge".
        // To allow precise positioning without dropping, we distinguish tap vs drag release?
        // Actually, if drag ends, we just wait.
        // User explicitly said "Tap to merge". That implies a discrete action separate from dragging.
        
        if (!isDragging) {
            if (!isDropping) isDropping = true;
        }
        isDragging = false;
    }

    canvas.addEventListener('mousedown', e => inputStart(e.clientX));
    canvas.addEventListener('touchstart', e => inputStart(e.touches[0].clientX), {passive: false});
    
    canvas.addEventListener('mousemove', e => inputMove(e.clientX));
    canvas.addEventListener('touchmove', e => { e.preventDefault(); inputMove(e.touches[0].clientX); }, {passive: false});
    
    canvas.addEventListener('mouseup', inputEnd);
    canvas.addEventListener('touchend', inputEnd);

    // Boot
    generateNoise();
    spawnPacket();
    requestAnimationFrame(loop);
});
</script>
</body>
</html>
