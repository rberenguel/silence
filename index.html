<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Cancel noise using destructive interference">
    <meta name="theme-color" content="#000000">
    <title>Silence</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fonts/iconoir/iconoir.css">
    <link rel="stylesheet" href="fonts/sixtyfour.css">
    <link rel="stylesheet" href="fonts/monoid.css">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>

<div id="splash-screen">
  <h1>SILENCE</h1>
  <p>Cancel the noise signal using destructive interference</p>
  <p><strong>DRAG:</strong> Position wavelet horizontally</p>
  <p><strong>TAP TOP:</strong> Drop wavelet to merge</p>
  <p><strong>TAP BOTTOM:</strong> Flip wavelet polarity</p>
  <p>Keep RMS below 5.0 to survive</p>
  <div class="tap-hint">TAP TO START</div>
</div>

<div id="game-ui">
  <div class="hud-text">RMS: <span id="noise-lvl">0.00</span><i id="rms-trend" class="rms-indicator"></i></div>
  <div class="hud-text" id="status-display">COMPLEXITY: <span id="complexity-disp">1</span></div>
</div>
<canvas id="scope"></canvas>
<div id="controls-hint">DRAG: Align Phase | TAP TOP: Drop | TAP BOTTOM: Flip</div>

<script src="game.js"></script>
<script>
// Register service worker for PWA offline support
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registered'))
            .catch(err => console.log('Service Worker registration failed:', err));
    });
}
</script>
</body>
</html>
